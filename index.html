<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Adda"/>
<title>Adda — Chat & Call</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0f;--s1:#13131a;--s2:#1c1c26;--s3:#242433;
  --bdr:#2e2e42;--acc:#f97316;--acc2:#fb923c;--acc3:#fed7aa;
  --grn:#22c55e;--red:#ef4444;--blu:#3b82f6;
  --txt:#f0f0ff;--sub:#9898b8;--font:'Sora',sans-serif;
  --hfont:'Hind Siliguri',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--font);height:100dvh}
input,button,textarea{font-family:var(--font)}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}

/* ══ SCREENS ══ */
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}

/* ══ AUTH ══ */
#scr-auth{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#1a0f00 0%,var(--bg) 70%);
}
.auth-wrap{width:min(400px,94vw);animation:up .5s ease}
.brand{text-align:center;margin-bottom:32px}
.brand-logo{
  width:72px;height:72px;border-radius:22px;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:0 0 40px rgba(249,115,22,.35);
}
.brand-name{font-size:32px;font-weight:800;letter-spacing:-1.5px}
.brand-name span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-tag{color:var(--sub);font-size:13px;margin-top:4px;font-family:var(--hfont)}
.tabs{display:flex;background:var(--s1);border:1px solid var(--bdr);border-radius:14px;padding:4px;margin-bottom:22px}
.tab{flex:1;padding:10px;border:none;background:transparent;color:var(--sub);font-weight:600;font-size:14px;border-radius:10px;transition:all .2s}
.tab.on{background:var(--s2);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.inp{width:100%;padding:13px 15px;background:var(--s1);border:1.5px solid var(--bdr);border-radius:12px;color:var(--txt);font-size:14px;outline:none;transition:border .2s;margin-bottom:12px;display:block}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--sub)}
.btn-main{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),#c2410c);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.4px;transition:opacity .2s,transform .1s}
.btn-main:active{opacity:.85;transform:scale(.98)}
.auth-err{color:var(--red);font-size:12px;text-align:center;margin:-6px 0 10px;min-height:16px}

/* ══ APP LAYOUT ══ */
#scr-app{flex-direction:row}
.sidebar{
  width:320px;flex-shrink:0;border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;background:var(--s1);
}
.main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ══ SIDEBAR TOP ══ */
.sb-top{
  padding:14px 14px 10px;border-bottom:1px solid var(--bdr);
  background:linear-gradient(180deg,var(--s2) 0%,var(--s1) 100%);
}
.sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sb-brand-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.sb-brand-name{font-weight:800;font-size:18px;letter-spacing:-.5px}
.sb-brand-name span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-actions{display:flex;gap:6px;margin-left:auto}
.ib{background:none;border:none;color:var(--sub);padding:7px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ib:hover,.ib:active{background:var(--s3);color:var(--txt)}
.sb-search{
  width:100%;padding:9px 12px 9px 36px;background:var(--s3);
  border:1px solid var(--bdr);border-radius:10px;color:var(--txt);
  font-size:13px;outline:none;
}
.sb-search::placeholder{color:var(--sub)}
.search-wrap{position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}

/* ══ CHAT LIST ══ */
.chat-list{flex:1;overflow-y:auto}
.ci{
  display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;
  transition:background .15s;position:relative;
}
.ci:hover,.ci.on{background:var(--s2)}
.ci.on{border-left:3px solid var(--acc)}
.ava{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:17px;color:#fff;flex-shrink:0;
  position:relative;
}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ava-sm{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;flex-shrink:0;
}
.ondot{
  width:10px;height:10px;background:var(--grn);border-radius:50%;
  border:2px solid var(--s1);position:absolute;bottom:0;right:0;
}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-last{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-time{font-size:11px;color:var(--sub);flex-shrink:0}
.no-chats{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--sub);padding:40px;text-align:center;gap:10px;
}
.no-chats-icon{font-size:40px;opacity:.4}

/* ══ ME BADGE ══ */
.me-badge{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--bdr);background:var(--s2);
}
.me-info{flex:1;min-width:0}
.me-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-email{font-size:11px;color:var(--sub)}

/* ══ MAIN / EMPTY STATE ══ */
.main-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--sub);gap:14px;
}
.main-empty-icon{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  opacity:.3;
}

/* ══ CHAT WINDOW ══ */
.chat-win{flex:1;display:none;flex-direction:column;overflow:hidden}
.chat-win.on{display:flex}

.chat-head{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--bdr);background:var(--s1);flex-shrink:0;
}
.chat-head-info{flex:1;min-width:0}
.chat-head-name{font-weight:700;font-size:15px}
.chat-head-status{font-size:11px;color:var(--grn);margin-top:1px}
.chat-head-status.off{color:var(--sub)}

.msgs{
  flex:1;overflow-y:auto;padding:14px 12px;
  display:flex;flex-direction:column;gap:5px;
  background:var(--bg);
}
.msg-row{display:flex;align-items:flex-end;gap:7px}
.msg-row.me{flex-direction:row-reverse}
.bbl{
  max-width:72%;padding:9px 13px;border-radius:18px;
  font-size:14px;line-height:1.55;word-break:break-word;
}
.bbl.them{background:var(--s2);border:1px solid var(--bdr);border-bottom-left-radius:4px}
.bbl.me{
  background:linear-gradient(135deg,var(--acc),#c2410c);
  color:#fff;border-bottom-right-radius:4px;
}
.bbl-time{font-size:10px;opacity:.55;display:block;text-align:right;margin-top:4px}
.no-msg{color:var(--sub);text-align:center;margin:40px auto;font-size:13px}

.inp-bar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--bdr);background:var(--s1);flex-shrink:0;
}
.msg-inp{
  flex:1;padding:11px 15px;background:var(--s2);border:1.5px solid var(--bdr);
  border-radius:26px;color:var(--txt);font-size:14px;outline:none;
  transition:border .2s;
}
.msg-inp:focus{border-color:var(--acc)}
.msg-inp::placeholder{color:var(--sub)}
.send-btn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;border:none;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  color:#fff;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.send-btn:active{transform:scale(.9)}

/* ══ CALL OVERLAY ══ */
.call-ov{
  position:fixed;inset:0;background:#000;z-index:300;
  display:none;flex-direction:column;
}
.call-ov.on{display:flex}
.rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lv{
  position:absolute;bottom:110px;right:14px;
  width:110px;height:155px;object-fit:cover;
  border-radius:16px;border:2px solid rgba(255,255,255,.25);
  background:#111;
}
.call-top{
  position:absolute;top:0;left:0;right:0;padding:60px 24px 24px;
  background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
  display:flex;flex-direction:column;align-items:center;
}
.call-av{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),#c2410c);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:#fff;margin-bottom:12px;
}
.call-name{font-size:24px;font-weight:700;color:#fff}
.call-stat{color:rgba(255,255,255,.6);font-size:13px;margin-top:4px}
.call-btns{
  position:absolute;bottom:36px;left:0;right:0;
  display:flex;justify-content:center;gap:20px;
}
.cb{
  width:60px;height:60px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;transition:transform .15s;
}
.cb:active{transform:scale(.88)}
.cb-m{background:rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.cb-e{background:var(--red)}
.cb-c{background:rgba(255,255,255,.15);backdrop-filter:blur(8px)}

/* ══ MODAL ══ */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.modal-bg.on{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--bdr);border-radius:22px;
  width:min(390px,94vw);padding:22px;animation:up .25s ease;
}
.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-ttl{font-weight:700;font-size:16px}
.urow{
  display:flex;align-items:center;gap:12px;padding:10px 8px;
  border-radius:12px;cursor:pointer;transition:background .15s;
}
.urow:hover{background:var(--s2)}
.urow-info .un{font-weight:600;font-size:14px}
.urow-info .ue{font-size:12px;color:var(--sub)}
.back-btn{display:none!important}

/* ══ MOBILE ══ */
@media(max-width:680px){
  .sidebar{width:100%}
  .main{
    position:fixed;inset:0;background:var(--bg);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    z-index:10;
  }
  .main.show{transform:none}
  .back-btn{display:flex!important}
}

/* ══ ANIMATIONS ══ */
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.msg-row{animation:up .2s ease}
</style>
</head>
<body>

<!-- ════ AUTH SCREEN ════ -->
<div id="scr-auth" class="scr on">
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-logo">💬</div>
      <div class="brand-name"><span>Adda</span></div>
      <div class="brand-tag">বন্ধুদের সাথে আড্ডা দাও — যেকোনো সময়, যেকোনো জায়গায়</div>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="setMode('login')">Sign In</button>
      <button class="tab" onclick="setMode('reg')">Sign Up</button>
    </div>
    <div id="name-wrap" style="display:none">
      <input id="inp-name" class="inp" placeholder="তোমার নাম লেখো" type="text"/>
    </div>
    <input id="inp-email" class="inp" placeholder="Email address" type="email"/>
    <input id="inp-pass" class="inp" placeholder="Password" type="password" onkeydown="if(event.key==='Enter')doAuth()"/>
    <p id="auth-err" class="auth-err"></p>
    <button class="btn-main" onclick="doAuth()" id="auth-btn">Sign In</button>
  </div>
</div>

<!-- ════ APP SCREEN ════ -->
<div id="scr-app" class="scr">

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-brand-icon">💬</div>
        <div class="sb-brand-name"><span>Adda</span></div>
        <div class="sb-actions">
          <button class="ib" title="নতুন চ্যাট" onclick="openModal()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button class="ib" title="Sign out" onclick="doOut()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          </button>
        </div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 111 11a6 6 0 0116 0z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </span>
        <input class="sb-search" placeholder="চ্যাট খোঁজো…" oninput="filterList(this.value)"/>
      </div>
    </div>
    <div class="chat-list" id="chat-list">
      <div class="no-chats">
        <div class="no-chats-icon">💬</div>
        <div>এখনো কোনো চ্যাট নেই<br/><span style="font-size:12px">+ বাটন দিয়ে শুরু করো!</span></div>
      </div>
    </div>
    <div class="me-badge" id="me-badge" style="display:none">
      <div class="ava-sm" id="me-av"></div>
      <div class="me-info">
        <div class="me-name" id="me-name"></div>
        <div class="me-email" id="me-email"></div>
      </div>
    </div>
  </div>

  <!-- ── MAIN ── -->
  <div class="main" id="main">
    <div class="main-empty" id="main-empty">
      <div class="main-empty-icon">💬</div>
      <div style="font-weight:600;font-size:16px">Adda শুরু করো!</div>
      <div style="font-size:13px">বাম দিক থেকে চ্যাট বেছে নাও</div>
    </div>
    <div class="chat-win" id="chat-win">
      <div class="chat-head">
        <button class="ib back-btn" onclick="goBack()">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="ava-sm" id="ch-av"></div>
        <div class="chat-head-info">
          <div class="chat-head-name" id="ch-name"></div>
          <div class="chat-head-status" id="ch-status"></div>
        </div>
        <button class="ib" title="Voice call" onclick="call(false)">
          <svg width="19" height="19" fill="currentColor" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </button>
        <button class="ib" title="Video call" onclick="call(true)">
          <svg width="19" height="19" fill="currentColor" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="inp-bar">
        <input class="msg-inp" id="msg-inp" placeholder="কিছু লেখো…" onkeydown="if(event.key==='Enter')send()"/>
        <button class="send-btn" onclick="send()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ════ CALL OVERLAY ════ -->
<div class="call-ov" id="call-ov">
  <video id="rv" class="rv" autoplay playsinline></video>
  <video id="lv" class="lv" autoplay playsinline muted style="display:none"></video>
  <div class="call-top">
    <div class="call-av" id="call-av"></div>
    <div class="call-name" id="call-nm"></div>
    <div class="call-stat" id="call-st">Calling…</div>
  </div>
  <div class="call-btns">
    <button class="cb cb-m" id="btn-mute" onclick="togMute()" title="Mute">🎤</button>
    <button class="cb cb-e" onclick="endCall()" title="End">📵</button>
    <button class="cb cb-c" id="btn-cam" onclick="togCam()" title="Camera">📷</button>
  </div>
</div>

<!-- ════ NEW CHAT MODAL ════ -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-top">
      <span class="modal-ttl">নতুন আড্ডা 💬</span>
      <button class="ib" onclick="closeModal()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <input class="inp" id="user-q" placeholder="নাম বা email দিয়ে খোঁজো…" oninput="searchU(this.value)" style="margin-bottom:8px"/>
    <div id="user-res" style="max-height:300px;overflow-y:auto"></div>
  </div>
</div>

<!-- ════ SUPABASE + LOGIC ════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ╔══════════════════════════════════════════╗
// ║  তোমার Supabase credentials এখানে দাও  ║
// ╚══════════════════════════════════════════╝
const SB_URL  = 'https://qmbhkdbxpcxadatlctew.supabase.co';
const SB_KEY  = 'sb_publishable_5YH2uUYYDoVm5AsWP0-2iQ_IzGYWCdq';
// ════════════════════════════════════════════

const sb = supabase.createClient(SB_URL, SB_KEY);

// ── State ───────────────────────────────────
let ME=null, ACT=null, allChats=[], msgCh=null;
let lStream=null, pConn=null, muted=false, camOff=false, vidCall=false;
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

// ── DOM shortcuts ───────────────────────────
const $=id=>document.getElementById(id);
const fmt=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const ini=n=>(n||'?')[0].toUpperCase();
function escH(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setAva(el,name){el.textContent=ini(name)}

// ── Auth UI ─────────────────────────────────
let MODE='login';
function setMode(m){
  MODE=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['login','reg'][i]===m));
  $('name-wrap').style.display=m==='reg'?'block':'none';
  $('auth-btn').textContent=m==='login'?'Sign In':'অ্যাকাউন্ট তৈরি করো';
}
function showErr(msg){$('auth-err').textContent=msg}

async function doAuth(){
  const email=$('inp-email').value.trim();
  const pass=$('inp-pass').value;
  showErr('');
  if(!email||!pass){showErr('সব ঘর পূরণ করো');return}
  $('auth-btn').textContent='…';
  try{
    if(MODE==='login'){
      const{error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    } else {
      const name=$('inp-name').value.trim();
      if(!name){showErr('নাম লেখো');$('auth-btn').textContent='অ্যাকাউন্ট তৈরি করো';return}
      const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
      if(error)throw error;
      if(data.user){
        await sb.from('profiles').upsert({id:data.user.id,name,email,online:true,updated_at:new Date().toISOString()});
      }
    }
  }catch(e){
    showErr(e.message.replace('AuthApiError: ',''));
    $('auth-btn').textContent=MODE==='login'?'Sign In':'অ্যাকাউন্ট তৈরি করো';
  }
}

// ── Session ─────────────────────────────────
sb.auth.onAuthStateChange(async(ev,sess)=>{
  if(sess?.user){
    const u=sess.user;
    await sb.from('profiles').upsert({
      id:u.id,name:u.user_metadata?.full_name||u.email.split('@')[0],
      email:u.email,online:true,updated_at:new Date().toISOString()
    });
    const{data:p}=await sb.from('profiles').select('*').eq('id',u.id).single();
    ME=p;
    initApp();
  } else {
    ME=null;
    document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
    $('scr-auth').classList.add('on');
  }
});

window.addEventListener('visibilitychange',()=>{
  if(ME) sb.from('profiles').update({online:!document.hidden,updated_at:new Date().toISOString()}).eq('id',ME.id);
});
window.addEventListener('beforeunload',()=>{ if(ME) sb.from('profiles').update({online:false}).eq('id',ME.id); });

async function doOut(){
  if(ME) await sb.from('profiles').update({online:false}).eq('id',ME.id);
  await sb.auth.signOut();
}

// ── App init ─────────────────────────────────
function initApp(){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $('scr-app').classList.add('on');
  $('me-badge').style.display='flex';
  setAva($('me-av'),ME.name);
  $('me-name').textContent=ME.name;
  $('me-email').textContent=ME.email;
  loadChats();
  listenIncoming();
  // realtime chat list update
  sb.channel('rt-chats').on('postgres_changes',{event:'*',schema:'public',table:'chats'},()=>loadChats()).subscribe();
}

// ── Load chats ────────────────────────────────
async function loadChats(){
  const{data}=await sb.from('chats')
    .select('*')
    .or(`user1_id.eq.${ME.id},user2_id.eq.${ME.id}`)
    .order('updated_at',{ascending:false});
  allChats=data||[];
  renderList(allChats);
}

function renderList(list){
  const el=$('chat-list');
  if(!list.length){
    el.innerHTML='<div class="no-chats"><div class="no-chats-icon">💬</div><div>এখনো কোনো চ্যাট নেই<br/><span style="font-size:12px">+ বাটন দিয়ে শুরু করো!</span></div></div>';
    return;
  }
  el.innerHTML=list.map(c=>{
    const name=c.user1_id===ME.id?c.other_name2:c.other_name;
    const uid=c.user1_id===ME.id?c.user2_id:c.user1_id;
    const online=c.user1_id===ME.id?c.u2_online:c.u1_online;
    return `<div class="ci${ACT?.id===c.id?' on':''}" onclick="openChat('${c.id}','${escH(name)}','${uid}')">
      <div class="ava" style="position:relative">${ini(name)}${online?'<div class="ondot"></div>':''}</div>
      <div class="ci-info">
        <div class="ci-name">${escH(name)}</div>
        <div class="ci-last">${escH(c.last_msg||'আড্ডা শুরু করো! 👋')}</div>
      </div>
      <span class="ci-time">${c.updated_at?fmt(c.updated_at):''}</span>
    </div>`;
  }).join('');
}

function filterList(q){
  renderList(allChats.filter(c=>{
    const n=(c.user1_id===ME.id?c.other_name2:c.other_name)||'';
    return n.toLowerCase().includes(q.toLowerCase());
  }));
}

// ── Open chat ─────────────────────────────────
async function openChat(id,name,uid){
  ACT={id,name,other_uid:uid};
  $('ch-name').textContent=name;
  setAva($('ch-av'),name);
  // status
  const{data:p}=await sb.from('profiles').select('online,updated_at').eq('id',uid).single();
  const st=$('ch-status');
  if(p?.online){st.textContent='● Online';st.className='chat-head-status';}
  else{st.textContent=p?.updated_at?'Last seen '+fmt(p.updated_at):'Offline';st.className='chat-head-status off';}
  // show
  $('main-empty').style.display='none';
  $('chat-win').classList.add('on');
  $('main').classList.add('show');
  // load messages
  $('msgs').innerHTML='';
  const{data:ms}=await sb.from('messages').select('*').eq('chat_id',id).order('created_at');
  (ms||[]).forEach(addMsg);
  scrollDown();
  $('msg-inp').focus();
  // realtime
  if(msgCh)sb.removeChannel(msgCh);
  msgCh=sb.channel('msgs-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`chat_id=eq.${id}`},p=>{addMsg(p.new);scrollDown();})
    .subscribe();
  // mark active
  document.querySelectorAll('.ci').forEach(e=>e.classList.remove('on'));
  event?.currentTarget?.classList.add('on');
}

function goBack(){$('main').classList.remove('show');ACT=null;}

function addMsg(m){
  const mine=m.sender_id===ME.id;
  const d=document.createElement('div');
  d.className='msg-row'+(mine?' me':'');
  d.innerHTML=`
    ${!mine?`<div class="ava-sm">${ini(ACT?.name)}</div>`:''}
    <div class="bbl ${mine?'me':'them'}">
      ${escH(m.content)}
      <span class="bbl-time">${fmt(m.created_at)}</span>
    </div>`;
  $('msgs').appendChild(d);
}

function scrollDown(){const m=$('msgs');m.scrollTop=m.scrollHeight;}

async function send(){
  const inp=$('msg-inp'),txt=inp.value.trim();
  if(!txt||!ACT)return;
  inp.value='';
  const now=new Date().toISOString();
  await sb.from('messages').insert({chat_id:ACT.id,sender_id:ME.id,content:txt,created_at:now});
  await sb.from('chats').update({last_msg:txt,updated_at:now}).eq('id',ACT.id);
}

// ── User search / new chat ─────────────────────
function openModal(){$('modal').classList.add('on');$('user-q').focus();searchU('');}
function closeModal(){$('modal').classList.remove('on');}

async function searchU(q){
  const{data}=await sb.from('profiles').select('*').neq('id',ME.id)
    .or(`name.ilike.%${q}%,email.ilike.%${q}%`).limit(20);
  const el=$('user-res');
  if(!data?.length){el.innerHTML='<p style="color:var(--sub);text-align:center;padding:16px;font-size:13px">কেউ পাওয়া গেল না</p>';return;}
  el.innerHTML=data.map(u=>`
    <div class="urow" onclick="newChat('${u.id}','${escH(u.name)}')">
      <div class="ava-sm">${ini(u.name)}</div>
      <div class="urow-info">
        <div class="un">${escH(u.name)}</div>
        <div class="ue">${escH(u.email)}</div>
      </div>
    </div>`).join('');
}

async function newChat(uid,name){
  closeModal();
  // existing chat?
  const{data:ex}=await sb.from('chats')
    .select('*')
    .or(`and(user1_id.eq.${ME.id},user2_id.eq.${uid}),and(user1_id.eq.${uid},user2_id.eq.${ME.id})`)
    .maybeSingle();
  if(ex){openChat(ex.id,name,uid);return;}
  const{data:c}=await sb.from('chats').insert({
    user1_id:ME.id,user2_id:uid,
    other_name:name,         // user1 এর জন্য other name = user2 এর নাম
    other_name2:ME.name,     // user2 এর জন্য other name = user1 এর নাম (ME)
    last_msg:'',updated_at:new Date().toISOString()
  }).select().single();
  if(c){openChat(c.id,name,uid);}
  loadChats();
}

// ── WebRTC Voice/Video ─────────────────────────
async function call(video){
  if(!ACT){alert('আগে একটা চ্যাট খোলো');return;}
  vidCall=video;
  try{
    lStream=await navigator.mediaDevices.getUserMedia({video,audio:true});
  }catch(e){
    try{lStream=await navigator.mediaDevices.getUserMedia({video:false,audio:true});}
    catch(e2){alert('Mic/Camera permission দাও');return;}
  }
  showCallUI(ACT.name,'Calling…',video);
  if(video){$('lv').srcObject=lStream;$('lv').style.display='block';}

  const room=[ME.id,ACT.other_uid].sort().join('_');
  pConn=new RTCPeerConnection({iceServers:ICE});
  lStream.getTracks().forEach(t=>pConn.addTrack(t,lStream));
  pConn.ontrack=e=>{$('rv').srcObject=e.streams[0];$('call-st').textContent='Connected ✓';};
  pConn.onicecandidate=async e=>{
    if(e.candidate) await sb.from('signaling').insert({room,from_id:ME.id,type:'ice',payload:JSON.stringify(e.candidate)});
  };
  const offer=await pConn.createOffer();
  await pConn.setLocalDescription(offer);
  await sb.from('signaling').insert({room,from_id:ME.id,type:'offer',payload:JSON.stringify(offer)});
  // listen answer
  sb.channel('sig-caller-'+room).on('postgres_changes',{event:'INSERT',schema:'public',table:'signaling',filter:`room=eq.${room}`},async p=>{
    const{type,payload,from_id}=p.new;
    if(from_id===ME.id)return;
    if(type==='answer')await pConn.setRemoteDescription(JSON.parse(payload));
    if(type==='ice')await pConn.addIceCandidate(new RTCIceCandidate(JSON.parse(payload))).catch(()=>{});
  }).subscribe();
}

function showCallUI(name,stat,video){
  $('call-ov').classList.add('on');
  $('call-nm').textContent=name;
  $('call-st').textContent=stat;
  $('call-av').textContent=ini(name);
  $('call-av').style.display=video?'none':'flex';
  $('rv').style.display=video?'block':'none';
}

async function listenIncoming(){
  sb.channel('incoming-'+ME.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'signaling'},async p=>{
    const{type,payload,from_id,room}=p.new;
    if(from_id===ME.id)return;
    if(type==='offer'&&!pConn){
      if(!confirm('📞 Incoming call! ধরবে?'))return;
      try{lStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}
      catch(e){try{lStream=await navigator.mediaDevices.getUserMedia({video:false,audio:true});}catch(e2){return;}}
      const{data:prof}=await sb.from('profiles').select('name').eq('id',from_id).single();
      const cname=prof?.name||'Unknown';
      showCallUI(cname,'Connected ✓',true);
      $('lv').srcObject=lStream;$('lv').style.display='block';
      pConn=new RTCPeerConnection({iceServers:ICE});
      lStream.getTracks().forEach(t=>pConn.addTrack(t,lStream));
      pConn.ontrack=e=>{$('rv').srcObject=e.streams[0];};
      pConn.onicecandidate=async e=>{
        if(e.candidate) await sb.from('signaling').insert({room,from_id:ME.id,type:'ice',payload:JSON.stringify(e.candidate)});
      };
      await pConn.setRemoteDescription(JSON.parse(payload));
      const ans=await pConn.createAnswer();
      await pConn.setLocalDescription(ans);
      await sb.from('signaling').insert({room,from_id:ME.id,type:'answer',payload:JSON.stringify(ans)});
    }
    if(type==='ice'&&pConn) pConn.addIceCandidate(new RTCIceCandidate(JSON.parse(payload))).catch(()=>{});
  }).subscribe();
}

function endCall(){
  pConn?.close();pConn=null;
  lStream?.getTracks().forEach(t=>t.stop());lStream=null;
  $('rv').srcObject=null;$('lv').srcObject=null;$('lv').style.display='none';
  $('call-ov').classList.remove('on');
  muted=false;camOff=false;
  $('btn-mute').textContent='🎤';$('btn-cam').textContent='📷';
}
function togMute(){muted=!muted;lStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('btn-mute').textContent=muted?'🔇':'🎤';}
function togCam(){camOff=!camOff;lStream?.getVideoTracks().forEach(t=>t.enabled=!camOff);$('btn-cam').textContent=camOff?'📵':'📷';}
</script>
